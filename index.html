<script>
'use strict';
const byName = new Intl.Collator('en', { sensitivity: 'base', numeric: true });
const cars = cnCars.slice().sort((a, b) => byName.compare(a[0], b[0]));
const metrics=['最大速度','加速','操控','氮气'];
const get=id=>document.getElementById(id), query=get('query'), options=get('options');
const clean=s=>s.normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
let target, played, finished, matches=[], active=-1;
function choose(previous){const pool=cars.filter(car=>car!==previous);return pool[Math.floor(Math.random()*pool.length)];}
function status(msg){get('message').textContent=msg;}
function counter(){get('counter').textContent='已猜 '+played.size+' 次';}
function buildRoster() {
  const groups = new Map();
  const buttons = new Map();
  const roster = get('roster');
  for (const car of cars) {
    const letter = car[0].normalize('NFD')[0].toUpperCase();
    const key = /^[A-Z]$/.test(letter) ? letter : '#';
    if (!groups.has(key)) {
      const group = document.createElement('section');
      group.className = 'roster-group';
      const heading = document.createElement('h4');
      heading.textContent = key;
      const list = document.createElement('ul');
      list.className = 'roster';
      group.append(heading, list);
      roster.append(group);
      const jump = document.createElement('button');
      jump.type = 'button';
      jump.textContent = key;
      jump.setAttribute('aria-label', '跳到 ' + key + ' 组');
      jump.addEventListener('click', () => {
        roster.scrollTop += group.getBoundingClientRect().top - roster.getBoundingClientRect().top;
      });
      get('alphabet').append(jump);
      groups.set(key, list);
    }
    const entry = document.createElement('li');
    const button = document.createElement('button');
    button.type = 'button';
    button.addEventListener('click', () => pick(car));
    entry.append(button);
    groups.get(key).append(entry);
    buttons.set(car, button);
  }
  return buttons;
}
const rosterButtons = buildRoster();
get('roster-count').textContent=cars.length+' 辆';
get('scope').textContent = cnCoverage;
function updateRoster(){for(const [c,button] of rosterButtons){button.textContent=c[0]+(played.has(c)?' · 已猜':'');button.disabled=finished||played.has(c);button.setAttribute('aria-pressed',String(!finished&&query.value===c[0]));}}
function hide(){options.hidden=true;query.setAttribute('aria-expanded','false');query.removeAttribute('aria-activedescendant');active=-1;matches=[];}
function search(){const s=clean(query.value);return cars.filter(c=>!s||clean(c[0]).includes(s)||clean(c[6]).includes(s));}
function suggest(){if(finished)return;matches=search().filter(c=>!played.has(c));active=-1;query.removeAttribute('aria-activedescendant');
  options.replaceChildren(...matches.map((c,i)=>{const item=document.createElement('div');item.id='option-'+i;item.className='choice';item.role='option';item.setAttribute('aria-selected','false');item.textContent=c[0];item.addEventListener('pointerdown',e=>e.preventDefault());item.addEventListener('click',()=>pick(c));return item;}));
  options.hidden=!matches.length;query.setAttribute('aria-expanded',String(!options.hidden));}
function pick(c){query.value=c[0];hide();query.focus();hide();updateRoster();status('已选 '+c[0]+'，按回车或点击提交。');}
function relation(a,b){return a>b?['high','↑ 偏高']:a<b?['low','↓ 偏低']:['same','= 相同'];}
function stats(c,compare){const grid=document.createElement('div');grid.className='stats';metrics.forEach((label,i)=>{const box=document.createElement('div');box.className='stat';const title=document.createElement('span');title.className='label';title.textContent=label;const value=document.createElement('b');value.textContent=c[i+1].toFixed(2);box.append(title,value);if(i===0){const unit=document.createElement('small');unit.textContent='km/h';box.append(unit);}if(compare){const tip=document.createElement('small');[tip.className,tip.textContent]=relation(c[i+1],target[i+1]);box.append(tip);}grid.append(box);});return grid;}
function end(){finished=true;hide();query.disabled=get('submit').disabled=true;updateRoster();
  status('已找到目标车辆，共猜测 '+played.size+' 次。');
  const box=get('result'), title=document.createElement('strong'), link=document.createElement('a');title.textContent='神秘车型：'+target[0];link.href=target[5];link.textContent='数据来源 ↗';link.target='_blank';link.rel='noopener';box.replaceChildren(title,link,stats(target,false));box.hidden=false;get('new').focus();}
function guess(c){if(finished)return;if(played.has(c)){status('这辆车已经猜过了。');return;}
  played.add(c);counter();const row=document.createElement('li'), top=document.createElement('div'), name=document.createElement('strong'), num=document.createElement('small');top.className='rowtop';name.textContent=c[0];num.textContent='#'+String(played.size).padStart(2,'0')+(c===target?' · 猜中':'');top.append(name,num);row.append(top,stats(c,true));get('history').prepend(row);get('empty').hidden=true;query.value='';hide();
  if(c===target)end();else{updateRoster();query.focus();hide();status('已记录 '+c[0]+'，可以继续猜。');}}
function reset(focus=false){target=choose(target);played=new Set();finished=false;query.disabled=get('submit').disabled=false;query.value='';hide();get('history').replaceChildren();get('empty').hidden=false;get('result').hidden=true;get('result').replaceChildren();counter();updateRoster();status('不限次数。从下方名单选车，或在搜索框输入车型。');if(focus){query.focus();hide();}}
get('form').addEventListener('submit',e=>{e.preventDefault();if(finished)return;if(active>=0){pick(matches[active]);return;}const q=clean(query.value), found=search(), exact=cars.find(c=>clean(c[0])===q);if(exact)guess(exact);else if(q&&found.length===1)guess(found[0]);else{status(q?'请选择列表中的具体车型。':'请输入或选择一辆车。');query.focus();suggest();}});
query.addEventListener('focus',suggest);query.addEventListener('click',suggest);query.addEventListener('input',()=>{suggest();updateRoster();});query.addEventListener('blur',hide);
query.addEventListener('keydown',e=>{if(e.key==='Escape'){hide();return;}if(!['ArrowDown','ArrowUp'].includes(e.key))return;e.preventDefault();if(options.hidden)suggest();if(!matches.length)return;const d=e.key==='ArrowDown'?1:-1;active=active<0?(d>0?0:matches.length-1):(active+d+matches.length)%matches.length;[...options.children].forEach((el,i)=>{el.classList.toggle('active',i===active);el.setAttribute('aria-selected',String(i===active));});const selected=options.children[active];query.setAttribute('aria-activedescendant',selected.id);selected.scrollIntoView({block:'nearest'});});
get('new').addEventListener('click',()=>reset(true));reset();
</script></body></html>
